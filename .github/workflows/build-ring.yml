name: Build GDH Ring APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build ring APK
        run: |
          chmod +x gradlew
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo 'DEXCOM_APPLICATION_ID="d89443d2-327c-4a6f-89e5-496bbb0317db"'
            echo 'DEXCOM_APPLICATION_ID_APAC="d8665ade-9673-4e27-9ff6-92db4ce13d13"'
            echo 'NIGHTSCOUT_DEBUG_SERVER=""'
          } > local.properties
          ./gradlew :mobile:assembleRing --stacktrace --no-configuration-cache

      - name: Find APK
        id: apk
        run: |
          APK=$(find mobile/build/outputs/apk/ring -name "*.apk" | head -n 1)
          cp "$APK" GDH_Ring.apk
          echo "file=GDH_Ring.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: GDH_Ring
          path: GDH_Ring.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ring-${{ github.run_number }}
          name: GDH Ring build ${{ github.run_number }}
          body: Widgets estilo Ring. Instala ao lado da GlucoDataHandler original (pacote de.michelinside.glucodatahandler.ring).
          files: GDH_Ring.apk
          make_latest: true
